name: CI

on:
  push:
    branches: [main, master, main-struktur]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Installera beroenden (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-net-dev libsdl2-mixer-dev

      - name: Installera beroenden (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_image sdl2_ttf sdl2_net sdl2_mixer

      - name: Bygg
        run: make

      - name: Kör tester
        run: make test || echo "Inga tester definierade ännu"
